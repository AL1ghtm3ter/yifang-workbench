<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>阅读室示例</title
  ><link rel="stylesheet" href="/examples/project.css" />
  <body>
    <main>
      <h1>一个独立的阅读室</h1>
      <p>这是随开源工作台提供的示例，没有真实私人资料。</p>
      <h2>如何接入你的项目</h2>
      <p>
        在本机配置中填写项目名称与URL。工作台通过iframe载入页面，你的服务仍由自己的项目管理。
      </p>
      <h2>可选的主题协议</h2>
      <p>
        项目可接收主题与阅读字号消息。也可以完全不接入协议，通过“原页”按钮独立使用。
      </p>
      <p>这页在隔离框架中运行，无法读取工作台的个人便笺。</p>
      <p id="bridgeStatus" role="status">等待工作台主题…</p>
    </main>
    <script src="/examples/bridge.js"></script>
  </body>
</html>
